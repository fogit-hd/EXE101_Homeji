    <linearGradient id="accent"><stop stop-color="#fb923c"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fdba74" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
