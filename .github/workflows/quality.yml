name: Web CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Web quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      API_PROXY_TARGET: http://127.0.0.1:5193
      HOMEJI_TEST_BASE_URL: http://127.0.0.1:4173
      PORT: "4173"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle
      - run: npx playwright install --with-deps chromium
      - name: Browser smoke on the production bundle
        run: |
          npm start > /tmp/homeji-web-ci.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          curl --fail --retry 15 --retry-connrefused --retry-delay 1 --silent "$HOMEJI_TEST_BASE_URL/" > /dev/null
          node tests/release-smoke.e2e.mjs
