# Render Blueprint — Web Service (SPA + /api proxy → Render API)
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: homeji
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PUBLIC_SITE_URL
        value: https://homeji.onrender.com
      - key: VITE_GA4_MEASUREMENT_ID
        value: G-VKPWYMZY40
      - key: VITE_GA4_MANUAL_PAGEVIEWS_READY
        value: "true"
      - key: VITE_GA4_DEBUG
        value: "false"
      - key: API_PROXY_TARGET
        value: https://homeji-be.onrender.com
      # Public OAuth client id used by Google Identity Services in the browser.
      # The matching origin is configured in Google Cloud and the same client is
      # registered in Supabase Auth's Google provider.
      - key: VITE_GOOGLE_CLIENT_ID
        value: 675096303664-kv4mvsd8rqldf2dicodtb7to8gpk1ipp.apps.googleusercontent.com
