<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="google-site-verification" content="QNId-_CgQloEHpcc6vKKJSO3U7oOhFi1EoB4-7TyhwA" />
    <script>
      (function () {
        var theme;
        try { theme = localStorage.getItem('homeji_theme') } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })()
    </script>
    <link rel="icon" type="image/png" href="/brand/homeji-logo2.png" />
    <link rel="apple-touch-icon" href="/brand/homeji-logo2.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#087f8c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Homeji — Tìm phòng trọ & bạn ở ghép</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <script>
      /* Only opening the bare home URL starts the intro. Decide before paint so
         deep links never flash the boot layer or lock scrolling while JS loads. */
      (function () {
        try {
          if (location.pathname === '/' && !location.search && !location.hash) document.documentElement.dataset.intro = '1'
        } catch (e) {}
      })()
    </script>
    <style>
      #hj-boot { display: none }
      html[data-intro='1'] #hj-boot {
        display: block; position: fixed; inset: 0; z-index: 2147483000;
        background:
          radial-gradient(60% 50% at 50% 46%, rgba(0, 177, 79, 0.10) 0%, rgba(0, 177, 79, 0) 70%),
          radial-gradient(130% 100% at 50% 40%, #ffffff 0%, #f5fcf8 45%, #eefaf3 100%);
      }
      html[data-intro='1'], html[data-intro='1'] body { overflow: hidden }
    </style>
  </head>
  <body>
    <div id="hj-boot" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
