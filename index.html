<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#087f8c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Homeji — Tìm phòng trọ & bạn ở ghép</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="image" href="/brand/homeji-logo2.png" />
    <script>
      /* Brand intro gate: decided before first paint so there is never a white flash
         or an intro flicker for returning visitors. Mirrors src/lib/introGate.ts. */
      (function () {
        try {
          var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches
          var seen = sessionStorage.getItem('hj-intro-seen') === '1'
          if (location.pathname === '/' && !reduce && !seen) document.documentElement.dataset.intro = '1'
        } catch (e) {}
      })()
    </script>
    <style>
      #hj-boot { display: none }
      html[data-intro='1'] #hj-boot {
        display: block; position: fixed; inset: 0; z-index: 2147483000;
        background: radial-gradient(120% 90% at 50% 45%, #0f2219 0%, #070f0b 60%, #040806 100%);
      }
      html[data-intro='1'], html[data-intro='1'] body { overflow: hidden }
    </style>
  </head>
  <body>
    <div id="hj-boot" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
